name: Probe (temporary)
on:
  pull_request:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: runner egress info
        run: curl -s https://ipinfo.io/json | grep -E '"(ip|country|org)"' || true
      - name: curl variants
        run: |
          W='https://www.jerusalem.muni.il/he/online-services/arnona/'
          C='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          curl -s -o /dev/null -w "curl chrome-ua: %{http_code}\n" -A "$C" "$W"
          curl -s -o /dev/null -w "curl h2 full hdrs: %{http_code}\n" --http2 -A "$C" -H "Accept: text/html,application/xhtml+xml,*/*;q=0.8" -H "Accept-Language: he-IL,he;q=0.9" -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" -H "Upgrade-Insecure-Requests: 1" "$W"
          curl -s -o /dev/null -w "jeron curl: %{http_code}\n" -A "$C" https://jeronlineforms.jerusalem.muni.il/Arrar
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: playwright
        run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'J'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const ctx = await b.newContext({ locale: 'he-IL', timezoneId: 'Asia/Jerusalem' });
          const p = await ctx.newPage();
          for (const u of ['https://www.jerusalem.muni.il/he/online-services/arnona/','https://jeronlineforms.jerusalem.muni.il/Arrar']) {
            try { const r = await p.goto(u, { timeout: 30000 }); console.log('playwright', r.status(), u); } catch (e) { console.log('playwright ERR', e.message.slice(0,100), u); }
          }
          await b.close();
          J
          node t.mjs
